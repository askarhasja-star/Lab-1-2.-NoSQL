<!DOCTYPE html>
<html>
    <head>
        <title>HTML Form Example</title>
    </head>
<body>
<form>
    <fieldset>
        <legend>Login Panel</legend>
        <label>
            Username: <input type="text">
        </label>
        <br/>
        <label>
            Password: <input type="password">
        </label>
        <br/>
        <label>
            <input type="submit" name="submit" value="LogIn">
        </label>
    </fieldset>
</form>
</body>
</html>
